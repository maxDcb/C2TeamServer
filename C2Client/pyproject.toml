[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "C2Client"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "setuptools",
    "pycryptodome==3.23.0",
    "grpcio==1.78.0",
    "PyQt6==6.7.0",
    "pyqtdarktheme",
    "protobuf==6.33.5",
    "gitpython==3.1.50",
    "requests==2.33.0",
    "pwn==1.0",
    "pefile==2024.8.26",
    "openai==3.36.1",
    "agent-core @ git+https://github.com/maxDcb/agent-core.git@cdb3232449f517f8f7db67fbab561e7845a41365",
    "donut-shellcode @ git+https://github.com/maxDcb/donut.git@master",
    "markdown",
    "PyYAML>=6,<7"
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-qt==4.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["C2Client*"]

[tool.setuptools.package-data]
C2Client = [
    "images/*.svg",
    "logs/*",
    "Scripts/*.py",
    "server.crt",
    "DropperModules.conf",
    "ShellCodeModules.conf",
    "assistant_agent/prompts/system/*.md",
    "assistant_agent/prompts/memory/*.md",
    "assistant_agent/skills/*/SKILL.md"
]

[project.scripts]
c2client = "C2Client.GUI:main"  # Entry point for CLI tool
c2jobs = "C2Client.jobs_cli:main"
