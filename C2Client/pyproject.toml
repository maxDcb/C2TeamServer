[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "C2Client"
version = "1.0.0rc1"
requires-python = ">=3.11"
dependencies = [    "pycryptodome==3.23.0",
    "grpcio==1.78.0",
    "PyQt6==6.7.0",
    "pyqtdarktheme==0.1.7",
    "protobuf==6.33.5",
    "gitpython==3.1.50",
    "requests==2.33.0",
    "pwn==1.0",
    "pefile==2024.8.26",
    "openai==1.102.0",
    "agent-core @ git+https://github.com/maxDcb/agent-core.git@v0.1.0",
    "donut-shellcode @ git+https://github.com/maxDcb/donut.git@728289d80dab68389897a5af1836ee571ed77987",
    "markdown==3.10.2"
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-qt==4.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["C2Client*"]

[tool.setuptools.package-data]
C2Client = [
    "images/*.svg",    "Scripts/*.py",
    "DropperModules.conf",
    "ShellCodeModules.conf",
    "assistant_agent/prompts/system/*.md",
    "assistant_agent/prompts/memory/*.md"
]

[project.scripts]
c2client = "C2Client.GUI:main"  # Entry point for CLI tool
